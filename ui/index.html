<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Therennai</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <img src="icon.svg" alt="" class="brand-mark">
          <span>Therennai</span>
        </div>
        <button class="icon-btn" id="collapseBtn" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
      </div>

      <button class="new-chat" id="newChatBtn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>

      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="text" placeholder="Search chats">
      </div>

      <div class="section-label">Recents</div>
      <nav class="chat-list" id="chatList"></nav>

      <div class="sidebar-bottom">
        <div class="avatar">U</div>
        <div class="user-meta">
          <div class="user-name">Local user</div>
          <div class="user-plan">Runs on this PC</div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="openSidebarBtn" title="Open sidebar" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
        <div class="chat-title" id="chatTitle">New chat</div>
      </header>

      <section class="conversation" id="conversation">
        <div class="empty" id="emptyState">
          <img src="icon.svg" alt="" class="empty-mark">
          <h1>What should we work on?</h1>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="composer">
          <div class="command-menu" id="commandMenu" hidden></div>
          <div class="prompt-wrap">
            <div class="prompt-highlight" id="promptHighlight" aria-hidden="true"></div>
            <textarea id="prompt" rows="1" placeholder="Message Therennai"></textarea>
          </div>
          <div class="composer-bar">
            <button type="button" class="icon-btn" title="Attach (coming soon)" aria-label="Attach" disabled>
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <div class="spacer"></div>

            <div class="picker" id="permissionPicker">
              <button type="button" class="picker-btn" id="permissionBtn" title="Permissions" aria-haspopup="listbox" aria-expanded="false">
                <svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8.5 7 10 4-1.5 7-5.5 7-10V6z"/></svg>
                <span id="permissionLabel">Chat only</span>
                <svg viewBox="0 0 24 24" class="chevron"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="picker-menu" id="permissionMenu" role="listbox" hidden></div>
            </div>

            <div class="picker" id="modelPicker">
              <button type="button" class="picker-btn" id="modelBtn" title="Model" aria-haspopup="listbox" aria-expanded="false">
                <span id="modelLabel">Therennai 1.0</span>
                <svg viewBox="0 0 24 24" class="chevron"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="picker-menu" id="modelMenu" role="listbox" hidden></div>
            </div>

            <button type="submit" class="send-btn" id="sendBtn" title="Send" aria-label="Send" disabled>
              <svg viewBox="0 0 24 24" class="icon-send"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              <svg viewBox="0 0 24 24" class="icon-stop"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
            </button>
          </div>
        </form>
        <div class="disclaimer">Therennai can make mistakes. Actions on your PC arrive in a later version.</div>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
